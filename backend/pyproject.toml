[project]
name = "projectzero"
version = "3.0.0.dev0"
description = "Project Zero (optimized) — deal-sourcing and investment-intelligence workbench on Supabase."
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format-nongpl]>=4.23",  # format-nongpl: enforces date-time / uri formats (review 001)
    "psycopg[binary]>=3.2",  # Postgres via the Supabase session pooler (transactions, advisory locks)
    "tzdata>=2025.2",  # Europe/Berlin for legacy timestamps on Windows (no system tz database)
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13", "mypy>=1.18", "httpx>=0.28"]

[project.scripts]
pz = "projectzero.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider -m \"not hosted\""
markers = ["hosted: runs against the hosted Supabase project in a scratch schema (scripts/db.ps1 itest)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# tests deliberately use look-alike Unicode (full-width punctuation, no-break space) to prove they are refused
"tests/**" = ["RUF001", "E501"]  # E501: fixtures mirror real legacy records, one record per line
# protected Taste Map rules: regexes and labels are verbatim (long patterns, U+2212 minus in reason texts)
"src/projectzero/dealflow/ranking/**" = ["E501", "RUF001"]
# protected Conviction rules (Taste Map, IMQ, operator status, the save rules): strings and messages are verbatim
"src/projectzero/conviction/**" = ["E501", "RUF001"]
"src/projectzero/ops/parity_conviction.py" = ["E501"]  # the synthetic corpus: one case per line
# protected Events rules (RC2 assessment, ladders, gazetteer, source catalogue): regexes and texts are verbatim
"src/projectzero/events/{engine,place,catalog,registry}.py" = ["E501"]
"src/projectzero/ops/parity_events_{read,write,scan}.py" = ["E501"]  # the synthetic corpus: one case per line

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["projectzero"]
strict = true
ignore_missing_imports = true
