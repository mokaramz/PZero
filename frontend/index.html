<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // apply the remembered theme before the first paint (no light flash on a dark reload)
      try {
        if (localStorage.getItem("pz.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#f3f1eb" />
    <title>Project Zero — Project A Sourcing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
